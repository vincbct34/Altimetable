services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-altimetable}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-altimetable}
      POSTGRES_DB: ${DB_DATABASE:-altimetable}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-altimetable}']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
